[project]
name = "tactile_genesis"
version = "0.1.0"
description = "Tactile sensor simulation and dexterous-hand RL tasks for the Tactile Genesis paper."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "coacd==1.0.11",
    "eden",
    "genesis-world[dev]",
    "rsl-rl-lib",
    "numpy==2.3.5",
    "objaverse==0.1.7",
    "optuna>=4.7.0",
    "PyYAML>=6.0.2",
    "scikit-learn>=1.5",
    "tensorboard>=2.20.0",
    "trimesh==4.12.2",
    "viser>=1.0.21",
    "wandb>=0.23.0",
    # Hardcode torch manually with the right CUDA index for (old) drivers, e.g.:
    # pip install "torch==2.10.0+cu128" --index-url https://download.pytorch.org/whl/cu128
    # "torch==2.10.0",
]

# pt_tnn supplies the recurrent cells behind the `tactile_convrnn` encoders. The paper's
# sweep uses `--tactile_encoder=rnn`, so it is optional; without it those encoders and
# their tests are skipped.
[project.optional-dependencies]
convrnn = ["pt_tnn"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# The project's own code lives under src/ as flat top-level modules (registry.py,
# task_mods.py, ...) and namespace packages (tasks/, entities/, ...). Installing
# editable puts them on the import path, so `uv run python main.py` works without
# needing `PYTHONPATH=src`.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "checkpoint_recording",
    "checkpoint_validation",
    "distill_experiments",
    "distill_manifest",
    "experiment_runs",
    "fresh_campaign",
    "lift_teacher",
    "model_config",
    "object_wrench",
    "optimization",
    "registry",
    "sensor_compat",
    "shared_terms",
    "smooth_checkpoint",
    "smooth_control",
    "tactile_record",
    "tactile_sensors",
    "task_mods",
    "teacher_evaluation",
    "teacher_video",
    "training_preferences",
    "utils",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

# Monorepo layout: resolve the sibling checkouts of eden/genesis/rsl_rl as editable local
# packages. These sources override the package origin across the whole resolution graph, so
# Eden's own transitive genesis-world / rsl-rl-lib requirements also point at the local
# checkouts. The vendored Genesis is v1.4.1 (a68b97b9), the revision the paper's runs pin.
[tool.uv.sources]
eden = { path = "../Eden", editable = true }
genesis-world = { path = "../Genesis", editable = true }
rsl-rl-lib = { path = "../rsl_rl", editable = true }

[tool.ruff]
line-length = 120
