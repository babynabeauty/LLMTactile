# Grasp sampling config for Sharpa in-fingers rotation.
grasp_generation:
  num_envs: 4096
  num_grasps: 64
  perturb_range: 0.2
  # Require enough configured surface-distance sensors below threshold.
  required_num_surface_distance_fingers: 3
  surface_distance_threshold: 0.02
  max_penetration: 0.003
  stability_steps: 1000
  max_displacement: 0.02
  # Keep the object near the seeded hand-relative pose while bootstrapping grasps.
  obj_pos_shift: "-0.01,0.01,-0.01,0.01,0.0,0.0"
  obj_euler_range: "0,0,0,0,-180,180"
  output_file: src/assets/grasps/in_fingers_rotate_sharpa_grasps_64.pt

scene_options:
  robot:
    default_root_pos: [0.083000, -0.009000, 0.400000]
    default_root_quat: [0.707107, 0.000000, -0.707107, 0.000000]
    default_dofs_pos:
      right_thumb_CMC_FE: 1.730000
      right_thumb_CMC_AA: -0.349100
      right_thumb_MCP_FE: -0.330000
      right_thumb_MCP_AA: 0.010000
      right_thumb_IP: 0.640000
      right_index_MCP_FE: 1.310000
      right_index_MCP_AA: -0.010000
      right_index_PIP: 0.250000
      right_index_DIP: 0.610000
      right_middle_MCP_FE: 1.060000
      right_middle_MCP_AA: 0.100000
      right_middle_PIP: 0.680000
      right_middle_DIP: 0.340000
      right_ring_MCP_FE: 1.290000
      right_ring_MCP_AA: 0.010000
      right_ring_PIP: 0.280000
      right_ring_DIP: 0.380000
      right_pinky_CMC: 0.190000
      right_pinky_MCP_FE: 1.310000
      right_pinky_MCP_AA: 0.110000
      right_pinky_PIP: 0.460000
      right_pinky_DIP: 0.230000
  obj:
    default_root_pos: [0.000000, 0.000000, 0.500000]
    default_root_quat: [1.000000, 0.000000, 0.000000, 0.000000]
