# Hardware-inspired simulation presets, not calibrated device specifications.
# Units and update/reset semantics: docs/tactile_experiments.md.
link_bool:
  params: {}
  imperfections:
    clean: {}
    mild:
      noise: 0.0075
    strong:
      noise: 0.03
bool:
  params:
    contact_threshold: 0.0005
  imperfections:
    clean: {}
    mild:
      release_threshold: 0.00042500000000000003
      dead_taxel_probability: 0.01
    strong:
      release_threshold: 0.0002
      dead_taxel_probability: 0.05
agg_bool:
  params:
    contact_threshold: 0.0005
  imperfections:
    clean: {}
    mild:
      release_threshold: 0.00042500000000000003
      dead_taxel_probability: 0.01
    strong:
      release_threshold: 0.0002
      dead_taxel_probability: 0.05
link_force:
  params:
    min_force: 0.0001
    max_force: 10.0
  imperfections:
    clean: {}
    mild:
      noise: 0.02
      random_walk: 0.0025
      resolution: 0.00125
    strong:
      noise: 0.08
      random_walk: 0.01
      resolution: 0.005
depth:
  params: {}
  imperfections:
    clean: {}
    mild:
      noise: 5.0e-05
      random_walk: 2.0e-06
      resolution: 2.5e-05
      probe_radius_noise: 7.5e-05
      dead_taxel_probability: 0.01
      probe_gain_resample_range:
      - 0.95
      - 1.05
      hysteresis_strength: 0.05
      hysteresis_tau: 0.05
    strong:
      noise: 0.0002
      random_walk: 8.0e-06
      resolution: 0.0001
      probe_radius_noise: 0.0003
      dead_taxel_probability: 0.05
      probe_gain_resample_range: &id001
      - 0.85
      - 1.15
      hysteresis_strength: 0.25
      hysteresis_tau: 0.15
agg_force:
  params: {}
  imperfections:
    clean: {}
    mild:
      noise: 5.0e-05
      random_walk: 2.0e-06
      resolution: 2.5e-05
      probe_radius_noise: 7.5e-05
      dead_taxel_probability: 0.01
