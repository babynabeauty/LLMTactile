force:
  torque_reference_length_m: 0.001 # 1 mm reference lever arm: N -> N m
  params: &id002
    normal_stiffness: 500.0
    normal_damping: 1.0
    normal_exponent: 1.2
    shear_scalar: 2.0
    twist_scalar: 2.0
    debug_probe_color:
    - 0.4
    - 0.7
    - 1.0
    debug_contact_color:
    - 1.0
    - 0.4
    - 0.4
  imperfections:
    clean: {}
    mild:
      noise: 0.00125
      random_walk: 0.0005
      bias: 0.0025
      resolution: 0.0025
      probe_radius_noise: 7.5e-05
      dead_taxel_probability: 0.01
