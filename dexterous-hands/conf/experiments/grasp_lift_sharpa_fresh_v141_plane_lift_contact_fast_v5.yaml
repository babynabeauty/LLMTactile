# v5: responsive plane-clearance lift with fingertip and palm-centre surface proximity.
observation_options:
  controller:
    state:
      name: controller_state
      noise: null
      clip: null
      scale: 1.0
      history_length: 0
      flatten_history_dim: false
      backfill: true
      _option_module_: eden.options.managers.observations
      _option_class_: ObservationTermOptions
    _option_module_: eden.options.managers.observations
    _option_class_: ObservationGroupOptions
  perturbation:
    perturbation_active:
      name: perturbation_active
      noise: null
      clip: null
      scale: 1.0
      history_length: 0
      flatten_history_dim: false
      backfill: true
      _option_module_: eden.options.managers.observations
      _option_class_: ObservationTermOptions
    _option_module_: eden.options.managers.observations
    _option_class_: ObservationGroupOptions
  root_controller:
    state:
      name: root_controller_state
      _option_module_: eden.options.managers.observations
      _option_class_: ObservationTermOptions
    _option_module_: eden.options.managers.observations
    _option_class_: ObservationGroupOptions
event_options:
  object_pulse:
    profile: probe
    name: object_wrench_pulse
    mode: interval
    interval_range_s:
    - 0.025
    - 0.025
    is_global_time: false
    min_step_count_between_reset: 0
    priority: 0
    strength: 0.25
    only_lifted_above_m: 0.05
    entity_name: obj
    draw_envs: []
    clean_fraction: 0.25
    _option_module_: eden.options.managers.events
    _option_class_: EventTermOptions
metric_options:
  joint_velocity:
    name: smooth_motion_metric
    quantity: joint_velocity
    _option_module_: eden.options.managers.metrics
    _option_class_: MetricTermOptions
  joint_acceleration:
    name: smooth_motion_metric
    quantity: joint_acceleration
    _option_module_: eden.options.managers.metrics
    _option_class_: MetricTermOptions
  target_velocity:
    name: smooth_motion_metric
    quantity: target_velocity
    _option_module_: eden.options.managers.metrics
    _option_class_: MetricTermOptions
  action_saturation:
    name: smooth_motion_metric
    quantity: action_saturation
    _option_module_: eden.options.managers.metrics
    _option_class_: MetricTermOptions
env_options:
  num_envs: 4096
  episode_length_s: 20.0
runner_options:
  max_iterations: 5000
  save_interval: 500
  seed: 42
  actor:
    distribution_cfg:
      init_std: 0.5
  algorithm:
    entropy_coef: 0.001
  obs_groups:
    actor:
    - goal
    - priv_proprio
    - priv_obj_state
    - priv_obj_props
    - controller
    - root_controller
    - perturbation
    teacher:
    - goal
    - priv_proprio
    - priv_obj_state
    - priv_obj_props
    - controller
    - root_controller
    - perturbation
    critic:
    - goal
    - priv_proprio
    - priv_obj_state
    - priv_obj_props
    - controller
    - root_controller
    - perturbation
action_options:
  dofs_pos_controller:
    name: smooth_pd_controller
    entity_name: robot
    dofs_name:
    - '*'
    scale_ratio: 0.75
    reference_source: default
    observation_version: smooth_teacher_v1
    offset: 0.0
    limit_targets: true
    max_target_velocity: 4.0
    scale: 1.0
    max_target_acceleration: 80.0
    ema_alpha: 0.0
    modifier: null
    _option_module_: eden.options.managers.actions
    _option_class_: ActionTermOptions
  ee_controller:
    name: smooth_root_pose_controller
    euler_x_range:
    - -45.0
    - 45.0
    euler_y_range:
    - -45.0
    - 45.0
    euler_z_range:
    - -45.0
    - 45.0
    linear_acceleration_limit: 8.0
    angular_acceleration_limit: 30.0
    pos_z_range:
    - 0.48
    - 1.0
    linear_velocity_limit: 0.6
    angular_velocity_limit: 3.0
reward_options:
  contact_proximity:
    name: surface_distance_reward
    weight: 1.0
    params:
      obs_name: surface_distance
      nearest_k: -1
      sigma: 0.03
      average: true
    _option_module_: eden.options.managers.rewards
    _option_class_: RewardTermOptions
  action_rate_penalty:
    weight: -0.001
  goal_tracking:
    name: goal_tracking_reward
    weight: 1.0
    _option_module_: eden.options.managers.rewards
    _option_class_: RewardTermOptions
    sigma_far: 0.25
  settled_carry:
    name: settled_carry_bonus
    weight: 2.0
    _option_module_: eden.options.managers.rewards
    _option_class_: RewardTermOptions
  lift:
    name: sustained_plane_lift_reward
    weight: 5.0
    object_name: obj
    plane_z: 0.5
    lift_bonus: 10.0
    lift_threshold: 0.05
    lift_scale: 1.0
  natural_motion:
    name: palm_down_penalty
    weight: -0.5
    _option_module_: eden.options.managers.rewards
    _option_class_: RewardTermOptions
  plane_clearance:
    name: plane_clearance_reward
    weight: 0.0
    plane_z: 0.5
    threshold: 0.05
    _option_module_: eden.options.managers.rewards
    _option_class_: RewardTermOptions
  approach:
    weight: 0.1
  held:
    weight: 0.5
