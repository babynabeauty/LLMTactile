env_options:
  num_envs: 8192
runner_options:
  max_iterations: 1500
  save_interval: 500
  actor:
    distribution_cfg:
      init_std: 0.3
  seed: 42
  algorithm:
    entropy_coef: 0.002
  obs_groups:
    critic:
    - goal
    - priv_proprio
    - priv_obj_state
    - priv_obj_props
    - controller
    - perturbation
    student:
    - proprio
    - goal
    teacher:
    - goal
    - priv_proprio
    - priv_obj_state
    - controller
    - perturbation
    rnd_state:
    - goal
    - priv_proprio
    - priv_obj_state
    - priv_obj_props
    actor:
    - goal
    - priv_proprio
    - priv_obj_state
    - controller
    - perturbation
action_options:
  dofs_pos_controller:
    name: smooth_pd_controller
    entity_name: robot
    dofs_name:
    - '*'
    scale_ratio: null
    reference_source: accumulate
    observation_version: smooth_teacher_v1
    offset: 0.0
    limit_targets: true
    max_target_velocity: 0.8
    scale: 0.041666666666666664
    max_target_acceleration: 8.0
    ema_alpha: 0.8
    modifier: null
    _option_module_: eden.options.managers.actions
    _option_class_: ActionTermOptions
    accumulator_hard_limits: true
reward_options:
  success_bonus:
    name: settled_goal_completion
    weight: 20.0
    params:
      command_name: goal_rot
  action_rate_penalty:
    weight: -0.005
  work_penalty:
    weight: -0.1
  track_orientation_inv_l2:
    weight: 0.0
  pose_regularization:
    name: similar_to_default
    params:
      entity_name: robot
    weight: -0.04
    _option_module_: eden.options.managers.rewards
    _option_class_: RewardTermOptions
  track_orientation_gaussian:
    params:
      command_name: goal_rot
      sigma: 0.4
      obs_term_name: null
  rotation_progress:
    weight: 30.0
    negative_scale: 1.0
scene_options:
  robot:
    default_dofs_pos:
      r_thumb_cmc_flex: 0.8
      r_thumb_mcp: 0.8
      r_thumb_ip: 0.8
      r_index_finger_mcp_flex: 0.8
      r_index_finger_pip: 0.8
      r_index_finger_dip: 0.8
      r_middle_finger_mcp_flex: 0.8
      r_middle_finger_pip: 0.8
      r_middle_finger_dip: 0.8
      r_ring_finger_mcp_flex: 0.8
      r_ring_finger_pip: 0.8
      r_ring_finger_dip: 0.8
      r_pinky_mcp_flex: 0.8
      r_pinky_pip: 0.8
      r_pinky_dip: 0.8
observation_options:
  controller:
    state:
      name: controller_state
      noise: null
      clip: null
      scale: 1.0
      history_length: 0
      flatten_history_dim: false
      backfill: true
      _option_module_: eden.options.managers.observations
      _option_class_: ObservationTermOptions
    _option_module_: eden.options.managers.observations
    _option_class_: ObservationGroupOptions
  perturbation:
    perturbation_active:
      name: perturbation_active
      noise: null
      clip: null
      scale: 1.0
      history_length: 0
      flatten_history_dim: false
      backfill: true
      _option_module_: eden.options.managers.observations
      _option_class_: ObservationTermOptions
    _option_module_: eden.options.managers.observations
    _option_class_: ObservationGroupOptions
event_options:
  place_obj:
    range_x:
    - -0.02
    - 0.0
  object_pulse:
    profile: probe
    name: object_wrench_pulse
    mode: interval
    interval_range_s:
    - 0.025
    - 0.025
    is_global_time: false
    min_step_count_between_reset: 0
    priority: 0
    strength: 0.0
    entity_name: obj
    draw_envs: []
    clean_fraction: 0.25
    _option_module_: eden.options.managers.events
    _option_class_: EventTermOptions
command_options:
  goal_rot:
    name: reachable_settled_target_rotation_command
    settle_time: 0.25
    max_success_angular_speed: 0.25
    min_angle: 0.15
    max_angle: 0.3
    resampling_time_range:
    - 6.0
    - 8.0
metric_options:
  joint_velocity:
    name: smooth_motion_metric
    quantity: joint_velocity
    _option_module_: eden.options.managers.metrics
    _option_class_: MetricTermOptions
  joint_acceleration:
    name: smooth_motion_metric
    quantity: joint_acceleration
    _option_module_: eden.options.managers.metrics
    _option_class_: MetricTermOptions
  target_velocity:
    name: smooth_motion_metric
    quantity: target_velocity
    _option_module_: eden.options.managers.metrics
    _option_class_: MetricTermOptions
  action_saturation:
    name: smooth_motion_metric
    quantity: action_saturation
    _option_module_: eden.options.managers.metrics
    _option_class_: MetricTermOptions
