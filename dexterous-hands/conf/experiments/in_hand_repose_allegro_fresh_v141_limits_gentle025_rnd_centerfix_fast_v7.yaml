# v4: rebuttal-responsive bounded targets; exact-goal and gentle-probe protocol unchanged.
env_options:
  num_envs: 8192
runner_options:
  max_iterations: 6000
  save_interval: 500
  actor:
    distribution_cfg:
      init_std: 0.3
  seed: 42
  algorithm:
    entropy_coef: 0.002
  obs_groups:
    critic:
    - goal
    - priv_proprio
    - priv_obj_state
    - priv_obj_props
    - controller
    - perturbation
    student:
    - proprio
    - goal
    teacher:
    - goal
    - priv_proprio
    - priv_obj_state
    - controller
    - perturbation
    rnd_state:
    - goal
    - priv_proprio
    - priv_obj_state
    - priv_obj_props
    actor:
    - goal
    - priv_proprio
    - priv_obj_state
    - controller
    - perturbation
action_options:
  dofs_pos_controller:
    name: smooth_pd_controller
    entity_name: robot
    dofs_name:
    - '*'
    scale_ratio: null
    reference_source: accumulate
    observation_version: smooth_teacher_v1
    offset: 0.0
    limit_targets: true
    max_target_velocity: 4.0
    scale: 0.08333333333333333
    max_target_acceleration: 80.0
    ema_alpha: 0.0
    modifier: null
    _option_module_: eden.options.managers.actions
    _option_class_: ActionTermOptions
    accumulator_hard_limits: true
reward_options:
  success_bonus:
    name: settled_goal_completion
    weight: 20.0
    params:
      command_name: goal_rot
  action_rate_penalty:
    weight: -0.001
  work_penalty:
    weight: 0.0
  track_orientation_inv_l2:
    weight: 0.2
    params:
      command_name: goal_rot
      rot_eps: 0.1
  track_orientation_gaussian:
    weight: 0.0
  rotation_progress:
    weight: 0.0
  obj_force_penalty:
    weight: 0.0
  goal_timeout_penalty:
    weight: 0.0
  surface_distance_reward:
    weight: 0.0
  joint_limits_penalty:
    name: repose_joint_limit_margin_penalty
    weight: -0.04
    params:
      entity_name: robot
      margin: 0.1
    _option_module_: eden.options.managers.rewards
    _option_class_: RewardTermOptions
  default_pose_penalty:
    name: default_pose_l1_penalty
    weight: -0.04
    params:
      entity_name: robot
    _option_module_: eden.options.managers.rewards
    _option_class_: RewardTermOptions
  is_dropped:
    weight: -100.0
scene_options:
  robot:
    default_dofs_pos:
      index_roll: 0.082
      index_bend0: 1.394
      index_bend1: 0.415
      index_bend2: 0.448
      thumb_bend0: 1.254
      thumb_roll: 1.163
      thumb_bend1: 1.103
      thumb_bend2: 0.012
      middle_roll: 0.005
      middle_bend0: 1.246
      middle_bend1: 0.23
      middle_bend2: 0.3
      ring_roll: 0.029
      ring_bend0: 1.487
      ring_bend1: 0.435
      ring_bend2: 0.467
    default_root_pos:
    - 0.0
    - 0.0
    - 0.43
observation_options:
  controller:
    state:
      name: controller_state
      noise: null
      clip: null
      scale: 1.0
      history_length: 0
      flatten_history_dim: false
      backfill: true
      _option_module_: eden.options.managers.observations
      _option_class_: ObservationTermOptions
    _option_module_: eden.options.managers.observations
    _option_class_: ObservationGroupOptions
  perturbation:
    perturbation_active:
      name: perturbation_active
      noise: null
      clip: null
      scale: 1.0
      history_length: 0
      flatten_history_dim: false
      backfill: true
      _option_module_: eden.options.managers.observations
      _option_class_: ObservationTermOptions
    _option_module_: eden.options.managers.observations
    _option_class_: ObservationGroupOptions
event_options:
  object_pulse:
    profile: probe
    name: object_wrench_pulse
    mode: interval
    interval_range_s:
    - 0.025
    - 0.025
    is_global_time: false
    min_step_count_between_reset: 0
    priority: 0
    strength: 0.25
    entity_name: obj
    draw_envs: []
    clean_fraction: 0.25
    _option_module_: eden.options.managers.events
    _option_class_: EventTermOptions
    probe_wrench_scale: 0.25
  place_obj:
    name: variant_centered_repose_reset
    range_x:
    - -0.001
    - 0.001
    range_y:
    - -0.001
    - 0.001
    variant_centers:
    - &id002
      - -0.0075
      - 0.0
    - &id001
      - 0.0
      - 0.0
    - *id001
    - *id002
    - *id001
    - *id001
    - *id001
    - *id001
    - - 0.0
      - 0.0075
    - - -0.015
      - -0.015
    - *id001
command_options:
  goal_rot:
    name: reachable_settled_target_rotation_command
    settle_time: 0.25
    max_success_angular_speed: 0.25
    min_angle: 0.5
    max_angle: 0.5
    resampling_time_range:
    - 6.0
    - 8.0
metric_options:
  joint_velocity:
    name: smooth_motion_metric
    quantity: joint_velocity
    _option_module_: eden.options.managers.metrics
    _option_class_: MetricTermOptions
  joint_acceleration:
    name: smooth_motion_metric
    quantity: joint_acceleration
    _option_module_: eden.options.managers.metrics
    _option_class_: MetricTermOptions
  target_velocity:
    name: smooth_motion_metric
    quantity: target_velocity
    _option_module_: eden.options.managers.metrics
    _option_class_: MetricTermOptions
  action_saturation:
    name: smooth_motion_metric
    quantity: action_saturation
    _option_module_: eden.options.managers.metrics
    _option_class_: MetricTermOptions
